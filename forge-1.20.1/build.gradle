plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.1.1'
group = 'com.xxsx.builder'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                xxsx_mc_smart_core {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', 'xxsx_builder'
        }
        server {
            property 'forge.enabledGameTestNamespaces', 'xxsx_builder'
            args '--nogui'
        }
    }
}

sourceSets.main.java.srcDirs = ['src/main/java', '../common/src/main/java']
sourceSets.main.java.exclude 'com/xxsx/builder/voxel/**'

sourceSets {
    modelImport {
        java.srcDirs = ['src/modelImport/java', 'src/main/java', '../common/src/main/java']
        java.include 'com/xxsx/builder/modelimport/ModelImportHandler.java'
        java.include 'com/xxsx/builder/modelimport/ModelImportMod.java'
        java.include 'com/xxsx/builder/voxel/**'
        resources.srcDirs = ['src/modelImport/resources']
    }
}

sourceSets.modelImport.compileClasspath += sourceSets.main.output
sourceSets.modelImport.runtimeClasspath += sourceSets.main.output
sourceSets.modelImport.compileClasspath += sourceSets.main.compileClasspath
sourceSets.modelImport.runtimeClasspath += sourceSets.main.runtimeClasspath

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "xxsx-mc-smart-core",
            "Specification-Vendor"    : "xxsx",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "xxsx",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named('jar') {
    archiveBaseName = 'xxsx-mc-smart-core-forge-1.20.1'
}

tasks.register('modelImportJar', Jar) {
    archiveBaseName = 'xxsx-mc-model-import-forge-1.20.1'
    archiveVersion = project.version
    from sourceSets.modelImport.output
    dependsOn tasks.named('modelImportClasses')
    manifest {
        attributes([
            'Specification-Title': 'xxsx-mc-model-import',
            'Specification-Vendor': 'xxsx',
            'Specification-Version': '1',
            'Implementation-Title': 'xxsx-mc-model-import-forge-1.20.1',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'xxsx'
        ])
    }
}

tasks.named('build') { dependsOn tasks.named('modelImportJar') }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
