plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.0.5'
group = 'com.xxsx.builder'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.java.srcDirs = ['src/main/java', '../common/src/main/java']
sourceSets.main.java.exclude 'com/xxsx/builder/voxel/**'

sourceSets {
    modelImport {
        java.srcDirs = ['src/modelImport/java', 'src/main/java', '../common/src/main/java']
        java.include 'com/xxsx/builder/modelimport/ModelImportHandler.java'
        java.include 'com/xxsx/builder/modelimport/ModelImportMod.java'
        java.include 'com/xxsx/builder/voxel/**'
        resources.srcDirs = ['src/modelImport/resources']
    }
}

sourceSets.modelImport.compileClasspath += sourceSets.main.output
sourceSets.modelImport.runtimeClasspath += sourceSets.main.output
sourceSets.modelImport.compileClasspath += sourceSets.main.compileClasspath
sourceSets.modelImport.runtimeClasspath += sourceSets.main.runtimeClasspath

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.enabledGameTestNamespaces', 'xxsx_builder'
        }
        register('client')
        register('server') { args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.0.1')
    compileOnly 'net.minecraftforge:javafmllanguage:26.2-65.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "xxsx-mc-smart-core",
            "Specification-Vendor"    : "xxsx",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "xxsx",
        ])
    }
}

tasks.named('jar') {
    archiveBaseName = 'xxsx-mc-smart-core-forge-26.2'
}

tasks.register('modelImportJar', Jar) {
    archiveBaseName = 'xxsx-mc-model-import-forge-26.2'
    archiveVersion = project.version
    from sourceSets.modelImport.output
    dependsOn tasks.named('modelImportClasses')
    manifest {
        attributes([
            'Specification-Title': 'xxsx-mc-model-import',
            'Specification-Vendor': 'xxsx',
            'Specification-Version': '1',
            'Implementation-Title': 'xxsx-mc-model-import-forge-26.2',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'xxsx'
        ])
    }
}

tasks.named('build') { dependsOn tasks.named('modelImportJar') }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
