name: Release NeoForge Client Jars

on:
  push:
    tags:
      - 'neoforge-v*'
      - 'neoforge-26.2-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release-assets/${GITHUB_REF_NAME}/*.jar)
          test "${#jars[@]}" -gt 0
          sha256sum "${jars[@]}"
      - uses: softprops/action-gh-release@v2
        with:
          name: Xxsx Smart Core ${{ github.ref_name }}
          body_path: .github/release-notes/neoforge-client.md
          files: release-assets/${{ github.ref_name }}/*.jar
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: false
