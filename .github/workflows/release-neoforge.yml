name: Release NeoForge Client Jars

on:
  push:
    tags:
      - 'neoforge-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release assets
        run: |
          set -euo pipefail
          test -f "release-assets/${GITHUB_REF_NAME}/xxsx-builder-neoforge-1.21.11-1.1.1.jar"
          test -f "release-assets/${GITHUB_REF_NAME}/xxsx-builder-neoforge-26.2-1.1.1.jar"
          sha256sum "release-assets/${GITHUB_REF_NAME}"/*.jar
      - uses: softprops/action-gh-release@v2
        with:
          name: NeoForge Client MC 1.21.11 + MC 26.2 ${{ github.ref_name }}
          body_path: .github/release-notes/neoforge-client.md
          files: release-assets/${{ github.ref_name }}/*.jar
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: false
