name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── forge-1.20.1 (JDK 17) ──
  forge-1-20-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-fg1201-${{ hashFiles('forge-1.20.1/**/gradle-wrapper.properties','common/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-fg1201-
      - run: cd forge-1.20.1 && chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: forge-1.20.1-jar, path: forge-1.20.1/build/libs/*.jar }

  # ── neoforge-1.21.11 (JDK 21) ──
  neoforge-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-nf12111-${{ hashFiles('neoforge-1.21.11/**/gradle-wrapper.properties','common/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-nf12111-
      - run: cd neoforge-1.21.11 && chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: neoforge-1.21.11-jar, path: neoforge-1.21.11/build/libs/*.jar }

  # ── neoforge-26.2 (JDK 25) ──
  neoforge-26-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-nf262-${{ hashFiles('neoforge-26.2/**/gradle-wrapper.properties','common/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-nf262-
      - run: cd neoforge-26.2 && chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: neoforge-26.2-jar, path: neoforge-26.2/build/libs/*.jar }

  # ── GitHub Release ──
  release:
    needs: [forge-1-20-1, neoforge-1-21-11, neoforge-26-2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: jars }
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/**/*.jar
          generate_release_notes: true
